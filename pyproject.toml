[project]
name = "lettereye"
version = "2.1.0"
description = "Local, GPU-accelerated letter sorting: OCR + a local decision model route scanned letters to the right worker."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "LetterEye AI contributors" }]
dependencies = [
    # UI (native desktop window via pywebview; falls back to the browser)
    "nicegui>=3.17",
    "pywebview>=6.0",
    # Local AI through Ollama + LangChain
    "langchain-core>=1.6",
    "langchain-ollama>=1.1",
    "ollama>=0.6",
    # Fast OCR: PP-OCRv6 on ONNX Runtime with a GPU execution provider per platform
    "rapidocr>=3.9",
    "onnxruntime-directml>=1.22; sys_platform == 'win32'",
    "onnxruntime-gpu>=1.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.22; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    # Documents, files, storage
    "pypdfium2>=4.30",
    "pillow>=10.1",
    "watchdog>=5.0",
    "platformdirs>=4.0",
    "pydantic>=2.8",
    "httpx>=0.27",
    # Installer + automatic updates from GitHub releases
    "velopack>=1.2.161",
]

[project.optional-dependencies]
# Native window on Linux (Windows uses WebView2 and macOS WebKit out of the box)
qt = ["pywebview[qt]>=6.0"]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
lettereye = "lettereye.main:main"

[project.urls]
Homepage = "https://github.com/mikexkllr/LetterEye-AI"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lettereye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server with the configured models"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
